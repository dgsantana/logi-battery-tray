# Build Windows and Linux binaries; a pushed v* tag publishes them as a GitHub release.
# workflow_dispatch builds the same artifacts without releasing, to try a change.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # Oldest supported runner, so the binary runs on older glibc too.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --release
      - run: cargo build --locked --release

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "logi-battery-tray-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target\release\logi-battery-tray.exe, packaging\install-windows.ps1, packaging\uninstall-windows.ps1, packaging\logi-battery-tray.png, README.md, LICENSE-MIT, LICENSE-APACHE $name
          Compress-Archive $name "$name.zip"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          name="logi-battery-tray-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp target/release/logi-battery-tray packaging/logi-battery-tray.desktop packaging/logi-battery-tray.svg README.md LICENSE-MIT LICENSE-APACHE "$name"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            logi-battery-tray-*.zip
            logi-battery-tray-*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag matches Cargo.toml version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} != Cargo.toml $version"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
        env:
          GH_TOKEN: ${{ github.token }}
