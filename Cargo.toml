[package]
name = "logi-battery-tray"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dgsantana/logi-battery-tray"

[dependencies]
env_logger = "0.11.11"
ksni = { version = "0.3.6", features = ["blocking"] }
log = "0.4.34"
notify-rust = "4.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }

[profile.release]
lto = "fat"
strip = "debuginfo"
opt-level = "z"